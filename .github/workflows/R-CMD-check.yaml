# R CMD check, on the GitHub runners and in the CRAN-like containers, via the
# reusable workflow in pedrobtz/r-actions. That workflow carries the reasoning;
# this file carries only what is specific to this package.
#
# The container half is the reason for the switch. This package compiles a
# vendored C parser, and vendored code is written against the compilers
# upstream tests on -- so the diagnostics it collects are the ones from the
# compiler nobody in this matrix was running. CRAN's debian-clang leg is
# clang 23 building C as -std=gnu23, which no GitHub runner is: the macOS
# runner's clang still defaults to __STDC_VERSION__ 201710L and GCC has a
# different diagnostic set entirely. Without the containers, the first report
# of an upstream warning is an incoming pretest, which is a rejected
# submission rather than a red check.
#
# -std=gnu23 also settles the one -pedantic warning noted in CLAUDE.md:
# `enum : int` in R's own R_ext/Boolean.h is a C23 extension under C17 and
# ordinary C23.
#
# No paths-ignore, unlike native-checks.yaml: --as-cran checks the URLs in
# README.md, which ships in the tarball, so a prose-only change is a real
# change here.
#
# Inputs: nosuggests, the NOSUGGESTS flavour CRAN runs with only hard
# dependencies installed, which verifies the guard in tests/testthat.R (#10);
# nold; and the runners with a Windows R-devel row. The extra flavours run in
# the full profile only. Otherwise the defaults are taken as they ship,
# including the containers
# matrix with no R-devel Linux row. That row was in the old hand-rolled matrix
# and is not missed -- the containers are R-devel on Linux already, on CRAN's
# own compilers, and pinning R-devel to the runner's own GCC matches no CRAN
# flavor. Add it back only as insurance against a stale container image.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "32 8 * * 0"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  # ci:minimal still runs R CMD check (ci.md, Labels), so it is not tested.
  R-CMD-check:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:R-CMD-check'))
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      nosuggests: true
      # CRAN's no-long-double flavour: the parse tests pin exact doubles, and
      # the long double width is a real platform difference here (#82).
      nold: true
      # The shared default plus Windows R-devel, which nothing else checks
      # (the containers cover R-devel on Linux only).
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
