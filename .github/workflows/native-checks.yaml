# Native-code checks for the C layer, via the reusable workflows in
# pedrobtz/r-actions, plus two jobs of the package's own (fuzz, jsontestsuite).
#
# The C boundary is where this package should be unusually strict: it vendors a
# C parser and points it at untrusted response bodies. These jobs are what make
# the robustness claims testable rather than asserted.
#
# Gating follows .claude/shared/ci.md. The r-actions workflows gate themselves
# through their own `changes` job; the two local jobs call changes.yml. Every
# job a pull request can start tests the labels first (`ci:docs`,
# `ci:minimal`, `skip-ci:<job>`; `full-ci` overrides), so a labelled pull
# request skips without taking a runner. There is no paths-ignore list: it
# followed none of the labels and drifted from the gate's rules.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Weekly, so that a latent problem surfaces without waiting for a push.
    - cron: "42 8 * * 0"
  workflow_dispatch:

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # UBSan on an ordinary runner under R-devel, plus the ASan containers.
  #
  # The clang-ubsan image is not in asan-containers: that job verifies with
  # `nm` that the installed .so carries __asan symbols, and the clang-ubsan
  # image patches its Makeconf with -fsanitize=undefined alone, so it would
  # fail the instrumentation check rather than run anything. The `sanitizers`
  # job runs UBSan over the whole suite on a runner instead, where
  # test-conditions.R interleaves failing and succeeding calls fifty times.
  #
  # asan-dependencies: false because the exerciser uses nothing but base R,
  # and the r-hub binary repository does not host testthat -- building it and
  # its dependencies from source under a sanitizer is slow and fragile.
  sanitizers:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:sanitizers'))
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      asan-dependencies: false
      asan-run: Rscript tools/sanitizer-exercise.R

  valgrind:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:valgrind'))
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1

  lto:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:lto'))
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # step 100 rather than the default 20. Measured here, serially, on the same
  # machine and one run each: the suite is 3.9s untortured, 86s at step 500 and
  # 473s at step 100. Step 20 was not measured to completion -- it was still
  # running when 100 had finished six times over -- and a CI runner is slower
  # again, so it is not a candidate. Re-measure rather than extrapolate if this
  # is ever revisited: the curve through three points mostly fits noise.
  #
  # Every path still runs and the suite still forces many thousands of
  # collections; what a larger step gives up is the odds that one lands while a
  # given unprotected SEXP is live. The rchk job covers the same class
  # statically on every push.
  gctorture:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:gctorture'))
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 100

  # Blocking. The first run reported two classes in zu_write.c, both of them
  # about the data frame plan: a PROTECT in zu_df_plan_init() matched by an
  # UNPROTECT in each of its two callers, which no per-function analysis can
  # check, and the names attribute treated as unprotected, which it was not --
  # rchk cannot see reachability through an attribute. Neither was a live bug.
  # Both are gone now that the plan's SEXPs are held in a keeper the caller
  # allocates and protects, so the balance is local and the protection is on
  # the stack where it can be seen.
  #
  # At zero findings the calculation reverses: the next one is a regression,
  # and an annotation nobody opens is not how you want to hear about it.
  rchk:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:rchk'))
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true

  # gcc -fanalyzer over the first-party C. src/vendor is yyjson verbatim and
  # never edited here, so its findings are reported under their own heading
  # but not gated on. Blocking from the start: the first run (gcc 16,
  # 2026-11-13) found 0 in the first-party sources and 6 in src/vendor, so the
  # next first-party finding is a regression, the same reasoning as rchk (#25).
  analyzers:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:analyzers'))
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      fail-on-findings: true
      exclude: |
        src/vendor

  # src/vendor/yyjson is yyjson verbatim and is never edited in place. There
  # is no manifest to verify against yet, so the tree-verification half is
  # skipped and only the PR guard runs -- but that is the half a verifier
  # cannot do anyway, because reproducibility is a property of the commit.
  #
  # must-update names the two places CLAUDE.md requires to move together with
  # a refresh: the version in the vendoring script, and the literal the test
  # suite asserts it against (the test carries a literal because tools/ is not
  # installed).
  vendor:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:vendor'))
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      must-update: |
        tools/vendor-yyjson.R
        tests/testthat/test-info.R

  # CRAN's rcnst, rlibro and vnu checks -- the "Additional issues" nothing
  # above reproduces. Full runs only: `quick`, which skips all three, on
  # pull requests; full on every other event.
  cran-special:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:cran-special'))
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  # The gate for the two local jobs below, decided from the changed files and
  # the labels by r-actions' changes.yml (ci.md, "A package's own workflows").
  changes:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: native-checks

  # Package-specific, so it stays a local job. test-fuzz.R runs a small version
  # of this on every test run; ZUJSON_FUZZ raises the iteration count to what
  # the ordinary suite cannot afford.
  fuzz:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true'
      && !contains(github.event.pull_request.labels.*.name, 'skip-ci:fuzz') }}
    runs-on: ubuntu-latest
    name: randomised input

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUJSON_FUZZ: "50000"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr, local::.
          needs: check

      - name: Fuzz the parser
        run: |
          Rscript -e 'stopifnot(length(testthat::test_local(
            filter = "fuzz", reporter = "summary", stop_on_failure = TRUE)) > 0)'

  # nst/JSONTestSuite at the commit pinned in tools/jsontestsuite.R: 95/95
  # y_ accepted, 188/188 n_ rejected, the i_ split and the parse/validate
  # divergence held to their recorded baselines. The script exits non-zero on
  # any miss or baseline move, so a read-flag change or a yyjson bump that
  # moves a conformance answer fails here rather than going unnoticed (#29).
  jsontestsuite:
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped'
      && needs.changes.outputs.docs-only != 'true'
      && !contains(github.event.pull_request.labels.*.name, 'skip-ci:jsontestsuite') }}
    runs-on: ubuntu-latest
    name: JSONTestSuite

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Run JSONTestSuite against the installed package
        run: Rscript tools/jsontestsuite.R
